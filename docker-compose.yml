# Stack de escala do VisionDesk (#2 Postgres + #2 MinIO + #7 MQTT + #3 MediaMTX).
# Sobe a infra que os adapters do backend consomem por env (degradam p/ local se ausente).
#   docker compose up -d
# Depois aponte o backend (backend/../.env):
#   VISIONDESK_DATABASE_URL=postgresql://visiondesk:visiondesk@localhost:5432/visiondesk
#   VISIONDESK_S3_ENDPOINT=http://localhost:9000
#   VISIONDESK_MQTT_URL=mqtt://localhost:1883
#   VISIONDESK_RESTREAM_BASE=http://localhost:8889
name: visiondesk

services:
  postgres:                       # #2/#5 — eventos/dimensões + TimescaleDB (séries)
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: visiondesk
      POSTGRES_PASSWORD: visiondesk
      POSTGRES_DB: visiondesk
    ports: ["5433:5432"]   # 5432 do host costuma estar ocupado → mapeia p/ 5433
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visiondesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:                          # #2 — object store p/ frames/gravações (Image_URI)
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: visiondesk
      MINIO_ROOT_PASSWORD: visiondesk123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:                           # #7 — broker p/ eventos → MES/SCADA
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./ops/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]

  mediamtx:                       # #3 — media server: 1 decode → fan-out WebRTC/HLS
    image: bluenviron/mediamtx:latest
    ports:
      - "1935:1935"   # RTMP ingest (DJI Fly → Visão Aérea)
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC (WHEP)
      - "8189:8189/udp"
      - "9997:9997"   # API
    volumes: ["./ops/mediamtx.yml:/mediamtx.yml:ro"]

volumes:
  pgdata:
  miniodata:
